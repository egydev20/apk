name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.EGY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret EGY_KEYSTORE_BASE64 is missing. Run 'Generate signing key (once)' first, then add the 4 secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npm run build
      - run: mkdir -p android/app/src/main/assets && cp dist/index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Restore fixed keystore
        run: echo "${{ secrets.EGY_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/egy-release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          EGY_KEYSTORE_FILE: ${{ runner.temp }}/egy-release.jks
          EGY_KEYSTORE_PASSWORD: ${{ secrets.EGY_KEYSTORE_PASSWORD }}
          EGY_KEY_ALIAS: ${{ secrets.EGY_KEY_ALIAS }}
          EGY_KEY_PASSWORD: ${{ secrets.EGY_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | tee cert.txt
          cp "$APK" EGY-Player-Pro.apk

      - run: rm -f "$RUNNER_TEMP/egy-release.jks"
        if: always()

      - uses: actions/upload-artifact@v4
        with:
          name: EGY-Player-Pro-APK
          path: |
            EGY-Player-Pro.apk
            cert.txt
