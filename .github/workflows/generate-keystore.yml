name: Generate signing key (once)
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Keystore password (8+ chars) — remember it"
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create keystore (valid 30 years)
        run: |
          echo "::add-mask::${{ github.event.inputs.password }}"
          keytool -genkeypair -v -keystore egy-release.jks -alias egyplayer \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "${{ github.event.inputs.password }}" -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=EGY Player Pro, O=EGY Player, C=EG"
          base64 -w0 egy-release.jks > egy-release.jks.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: egy-release-keystore-DELETE-AFTER-DOWNLOAD
          path: |
            egy-release.jks
            egy-release.jks.base64.txt
          retention-days: 1
